<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Housing Price Prediction</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* Animated background particles */
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      animation: float 15s infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) translateX(0); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-100vh) translateX(100px); opacity: 0; }
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      position: relative;
      z-index: 2;
    }

    .card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 50px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
      transform: translateY(0);
      transition: transform 0.3s ease;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    h1 {
      text-align: center;
      font-size: 3em;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 15px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      font-size: 1.1em;
      margin-bottom: 40px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 25px;
      margin-bottom: 30px;
    }

    .input-group {
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .input-group label {
      font-size: 14px;
      font-weight: 600;
      color: #444;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon {
      font-size: 18px;
    }

    .input-group input,
    .input-group select {
      padding: 14px 18px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      font-size: 15px;
      transition: all 0.3s ease;
      background: white;
      outline: none;
    }

    .input-group input:focus,
    .input-group select:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
      transform: translateY(-2px);
    }

    .input-group input:hover,
    .input-group select:hover {
      border-color: #b8c5f2;
    }

    .btn-predict {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      font-size: 18px;
      font-weight: 700;
      border: none;
      border-radius: 15px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
      position: relative;
      overflow: hidden;
    }

    .btn-predict:before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      transform: translate(-50%, -50%);
      transition: width 0.6s, height 0.6s;
    }

    .btn-predict:hover:before {
      width: 300px;
      height: 300px;
    }

    .btn-predict:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 40px rgba(102, 126, 234, 0.5);
    }

    .btn-predict:active {
      transform: translateY(-1px);
    }

    .result-container {
      margin-top: 40px;
      padding: 40px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 20px;
      text-align: center;
      opacity: 0;
      transform: scale(0.9);
      transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      box-shadow: 0 20px 60px rgba(102, 126, 234, 0.3);
    }

    .result-container.show {
      opacity: 1;
      transform: scale(1);
    }

    .result-label {
      color: rgba(255, 255, 255, 0.9);
      font-size: 1.2em;
      margin-bottom: 10px;
      font-weight: 500;
    }

    .result-price {
      color: white;
      font-size: 3.5em;
      font-weight: 800;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      animation: slideUp 0.6s ease;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .result-details {
      margin-top: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
    }

    .detail-item {
      background: rgba(255, 255, 255, 0.2);
      padding: 15px;
      border-radius: 12px;
      backdrop-filter: blur(10px);
    }

    .detail-label {
      color: rgba(255, 255, 255, 0.8);
      font-size: 0.9em;
      margin-bottom: 5px;
    }

    .detail-value {
      color: white;
      font-size: 1.3em;
      font-weight: 700;
    }

    /* 3D House Model */
    .house-model {
      width: 200px;
      height: 200px;
      margin: 0 auto 40px;
      position: relative;
      transform-style: preserve-3d;
      animation: rotate3d 20s infinite linear;
    }

    @keyframes rotate3d {
      from { transform: rotateY(0deg) rotateX(5deg); }
      to { transform: rotateY(360deg) rotateX(5deg); }
    }

    .house {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
    }

    .house-part {
      position: absolute;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: 2px solid rgba(255, 255, 255, 0.3);
    }

    .front {
      width: 120px;
      height: 120px;
      transform: translateZ(60px) translateX(40px) translateY(40px);
    }

    .back {
      width: 120px;
      height: 120px;
      transform: translateZ(-60px) translateX(40px) translateY(40px) rotateY(180deg);
    }

    .left {
      width: 120px;
      height: 120px;
      transform: rotateY(-90deg) translateZ(60px) translateY(40px);
    }

    .right {
      width: 120px;
      height: 120px;
      transform: rotateY(90deg) translateZ(60px) translateY(40px) translateX(120px);
    }

    .roof {
      width: 140px;
      height: 140px;
      background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
      transform: rotateX(45deg) translateZ(100px) translateX(30px) translateY(-10px);
      clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
    }

    @media (max-width: 768px) {
      .card {
        padding: 30px 20px;
      }

      h1 {
        font-size: 2em;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .house-model {
        width: 150px;
        height: 150px;
      }

      .result-price {
        font-size: 2.5em;
      }
    }
  </style>
</head>
<body>
  <div class="particles" id="particles"></div>

  <div class="container">
    <div class="card">
      <div class="house-model">
        <div class="house">
          <div class="house-part front"></div>
          <div class="house-part back"></div>
          <div class="house-part left"></div>
          <div class="house-part right"></div>
          <div class="roof"></div>
        </div>
      </div>

      <h1>🏠 Housing Price Predictor</h1>
      <p class="subtitle">Get instant property valuation with AI-powered insights</p>

      <form id="prediction-form">
        <div class="form-grid">
          <div class="input-group">
            <label><span class="icon">📐</span> Area (sq ft)</label>
            <input type="number" name="area" required min="100" placeholder="e.g., 2500">
          </div>

          <div class="input-group">
            <label><span class="icon">🛏️</span> Bedrooms</label>
            <input type="number" name="bedrooms" required min="1" placeholder="e.g., 3">
          </div>

          <div class="input-group">
            <label><span class="icon">🚿</span> Bathrooms</label>
            <input type="number" name="bathrooms" required min="1" placeholder="e.g., 2">
          </div>

          <div class="input-group">
            <label><span class="icon">🏢</span> Stories</label>
            <input type="number" name="stories" required min="1" placeholder="e.g., 2">
          </div>

          <div class="input-group">
            <label><span class="icon">🛣️</span> Main Road</label>
            <select name="mainroad">
              <option value="yes">Yes</option>
              <option value="no">No</option>
            </select>
          </div>

          <div class="input-group">
            <label><span class="icon">👥</span> Guest Room</label>
            <select name="guestroom">
              <option value="yes">Yes</option>
              <option value="no">No</option>
            </select>
          </div>

          <div class="input-group">
            <label><span class="icon">🏠</span> Basement</label>
            <select name="basement">
              <option value="yes">Yes</option>
              <option value="no">No</option>
            </select>
          </div>

          <div class="input-group">
            <label><span class="icon">♨️</span> Hot Water Heating</label>
            <select name="hotwaterheating">
              <option value="yes">Yes</option>
              <option value="no">No</option>
            </select>
          </div>

          <div class="input-group">
            <label><span class="icon">❄️</span> Air Conditioning</label>
            <select name="airconditioning">
              <option value="yes">Yes</option>
              <option value="no">No</option>
            </select>
          </div>

          <div class="input-group">
            <label><span class="icon">🚗</span> Parking Spaces</label>
            <input type="number" name="parking" required min="0" placeholder="e.g., 2">
          </div>

          <div class="input-group">
            <label><span class="icon">⭐</span> Preferred Area</label>
            <select name="prefarea">
              <option value="yes">Yes</option>
              <option value="no">No</option>
            </select>
          </div>

          <div class="input-group">
            <label><span class="icon">🪑</span> Furnishing Status</label>
            <select name="furnishingstatus">
              <option value="furnished">Furnished</option>
              <option value="semi-furnished">Semi-Furnished</option>
              <option value="unfurnished">Unfurnished</option>
            </select>
          </div>
        </div>

        <button type="submit" class="btn-predict">
          <span style="position: relative; z-index: 1;">✨ Predict Price</span>
        </button>
      </form>

      <div id="result" class="result-container">
        <div class="result-label">Estimated Property Value</div>
        <div class="result-price" id="price-display">₹0</div>
        <div class="result-details">
          <div class="detail-item">
            <div class="detail-label">Per Sq Ft</div>
            <div class="detail-value" id="per-sqft">₹0</div>
          </div>
          <div class="detail-item">
            <div class="detail-label">Market Range</div>
            <div class="detail-value" id="range">-</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Create floating particles
    function createParticles() {
      const particlesContainer = document.getElementById('particles');
      for (let i = 0; i < 50; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.animationDelay = Math.random() * 15 + 's';
        particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
        particlesContainer.appendChild(particle);
      }
    }

    createParticles();

    // Form submission
    document.getElementById('prediction-form').addEventListener('submit', function(event) {
      event.preventDefault();

      const formData = new FormData(this);
      
      const area = Number(formData.get('area'));
      const bedrooms = Number(formData.get('bedrooms'));
      const bathrooms = Number(formData.get('bathrooms'));
      const stories = Number(formData.get('stories'));
      const mainroad = formData.get('mainroad') === 'yes' ? 1 : 0;
      const guestroom = formData.get('guestroom') === 'yes' ? 1 : 0;
      const basement = formData.get('basement') === 'yes' ? 1 : 0;
      const hotwaterheating = formData.get('hotwaterheating') === 'yes' ? 1 : 0;
      const airconditioning = formData.get('airconditioning') === 'yes' ? 1 : 0;
      const parking = Number(formData.get('parking'));
      const prefarea = formData.get('prefarea') === 'yes' ? 1 : 0;
      const furnishingstatus = formData.get('furnishingstatus');

      let price = (area * 100) + (bedrooms * 5000) + (bathrooms * 3000) + (stories * 2000);
      price += mainroad * 10000;
      price += guestroom * 5000;
      price += basement * 7000;
      price += hotwaterheating * 4000;
      price += airconditioning * 6000;
      price += parking * 3000;
      price += prefarea * 8000;

      if (furnishingstatus === 'furnished') {
        price *= 1.2;
      } else if (furnishingstatus === 'semi-furnished') {
        price *= 1.1;
      }

      const perSqFt = price / area;
      const lowerRange = price * 0.95;
      const upperRange = price * 1.05;

      // Animate result
      const resultContainer = document.getElementById('result');
      resultContainer.classList.add('show');

      // Animate numbers
      animateValue('price-display', 0, price, 1500, true);
      animateValue('per-sqft', 0, perSqFt, 1500, true);
      
      setTimeout(() => {
        document.getElementById('range').textContent = 
          `₹${formatNumber(lowerRange)} - ₹${formatNumber(upperRange)}`;
      }, 500);

      // Scroll to result
      resultContainer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });

    function animateValue(id, start, end, duration, isCurrency) {
      const element = document.getElementById(id);
      const startTime = performance.now();
      
      function update(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);
        
        const easeOutQuart = 1 - Math.pow(1 - progress, 4);
        const current = start + (end - start) * easeOutQuart;
        
        element.textContent = isCurrency ? `₹${formatNumber(Math.floor(current))}` : Math.floor(current);
        
        if (progress < 1) {
          requestAnimationFrame(update);
        }
      }
      
      requestAnimationFrame(update);
    }

    function formatNumber(num) {
      return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    }

    // Add hover effects to inputs
    document.querySelectorAll('input, select').forEach(input => {
      input.addEventListener('focus', function() {
        this.parentElement.style.transform = 'translateY(-2px)';
      });
      
      input.addEventListener('blur', function() {
        this.parentElement.style.transform = 'translateY(0)';
      });
    });
  </script>
</body>
</html>
